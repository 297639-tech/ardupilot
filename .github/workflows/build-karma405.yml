name: Build KARMA405V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-chibios:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check hwdef is present
        run: ls -l libraries/AP_HAL_ChibiOS/hwdef/KARMA405V1/

      - name: Build bootloader
        run: Tools/scripts/build_bootloaders.py KARMA405V1

      - name: Build Copter
        run: |
          ./waf configure --board KARMA405V1
          ./waf copter

      - name: Collect output
        run: |
          mkdir -p out
          cp build/KARMA405V1/bin/* out/
          cp Tools/bootloaders/KARMA405V1_bl.* out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: KARMA405V1-firmware
          path: out/
